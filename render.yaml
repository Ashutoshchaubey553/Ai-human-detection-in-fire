# render.yaml — Render Blueprint for Fire Detection Flask App
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fire-human-detection-app
    runtime: python
    region: oregon          # or: singapore, frankfurt, ohio, virginia
    plan: starter           # free tier spins down; starter ($7/mo) recommended for RAM

    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind "0.0.0.0:$PORT" --config gunicorn_config.py

    envVars:
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"

    # Persistent disk for uploaded/processed output files (requires paid plan)
    disk:
      name: output-storage
      mountPath: /opt/render/project/src/static/output
      sizeGB: 1
